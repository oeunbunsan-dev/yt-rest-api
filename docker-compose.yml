services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: yt_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-youtube_clone}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-youtube_clone}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yt_network

  # ==========================================
  # 2. Redis In-Memory Cache & Rate Limiting
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: yt_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yt_network

  # ==========================================
  # 3. MinIO S3 Object Storage Service
  # ==========================================
  minio:
    image: pgsty/minio:latest
    container_name: yt_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - yt_network

  # ==========================================
  # 4. pgAdmin Database Management UI
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yt_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@youtubeclone.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-adminpassword}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - yt_network

  # ==========================================
  # 5. YouTube Clone REST API Service
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt_api
    restart: always
    ports:
      - "${API_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-youtube_clone}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-youtube-clone-assets}
      MINIO_PUBLIC_URL: http://localhost:9000/${MINIO_BUCKET:-youtube-clone-assets}
      JWT_SECRET: ${JWT_SECRET:-production_ultra_secure_jwt_access_token_secret_key_2026_xyz}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production_ultra_secure_jwt_refresh_token_secret_key_2026_xyz}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - yt_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:

networks:
  yt_network:
    driver: bridge
